<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Trips · VoyaGo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="dashboard.html">Voya<span>Go</span></a><nav class="nav-links"><a href="dashboard.html">Home</a><a href="search.html">Search</a><a class="active" href="trips.html">My Trips</a><a href="profile.html">Profile</a><button data-theme-toggle class="btn ghost">🌙</button><button data-logout class="btn ghost">Logout</button></nav></div></header><main class="page"><div class="container"><div class="row between wrap"><div><span class="eyebrow">Unified timeline</span><h1 style="font-size:42px">My Trips</h1><p>Flight departure → arrival → cab pickup → hotel check-in. Saved train options appear as additional trip items. Flight-linked timing recalculates automatically.</p></div><a class="btn primary" href="search.html">Add travel</a></div><div id="alerts" style="margin-top:20px"></div><div id="trips" class="grid" style="margin-top:20px"></div></div></main><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/guard.js"></script><script src="../js/ui.js"></script><script src="../js/pricing.js"></script><script src="../js/itinerary.js"></script><script>const s=initPage('user');const delayChoices=[15,30,60,90,120];function refundModal(booking){const r=refundBreakdown(booking),when=r.hoursRemaining>=48?'48h+':r.hoursRemaining>=24?'24–48h':'under 24h';const m=modal('Review cancellation refund',`<div class="card" style="background:var(--surface-2)"><div class="row between"><span>Saved item</span><strong>${escapeHtml(booking.id)}</strong></div><div class="row between" style="margin-top:10px"><span>Time before departure/check-in</span><strong>${when}</strong></div><div class="row between" style="margin-top:10px"><span>Refund rate</span><strong>${r.percent}%</strong></div><div class="row between" style="margin-top:10px"><span>Original total</span><strong>${formatINR(r.total)}</strong></div><div class="row between" style="margin-top:10px"><span>Refund</span><strong>${formatINR(r.amount)}</strong></div></div><p class="muted" style="margin-top:12px">The refund rate is calculated from the scheduled event time and stored on the booking.</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-close>Keep booking</button><button class="btn danger" id="confirmCancel">Remove & refund ${formatINR(r.amount)}</button></div>`);m.querySelector('#confirmCancel').onclick=()=>{const c=cancelBooking(booking.id,s.id);m.remove();toast(`Removed. Refund: ${formatINR(c.refund)}`);draw()}}
function delayAnimation(result,trip){const card=document.querySelector(`[data-trip-id="${trip.id}"]`);if(!card)return;card.querySelectorAll('[data-shifted="true"]').forEach(x=>{x.classList.add('shift-pulse')});setTimeout(()=>draw(),900)}
function draw(){const tripsData=userTrips(s.id);const alertsA=userAlerts(s.id).filter(a=>!a.visibleRead);alerts.innerHTML=alertsA.length?`<div class="card"><div class="row between"><h3>Notification center</h3><button class="btn ghost" id="markRead">Mark read</button></div>${alertsA.slice(0,8).map(a=>`<p><strong>${escapeHtml(a.title)}</strong> · ${escapeHtml(a.message)}</p>`).join('')}</div>`:'';document.getElementById('markRead')?.addEventListener('click',()=>{markUserAlertsRead(s.id);draw()});trips.innerHTML=tripsData.length?tripsData.map(trip=>{const bs=tripBookings(trip),flight=bs.find(b=>b.type==='flight'),timeline=getTripTimeline(trip);return `<article class="card" data-trip-id="${trip.id}"><div class="row between wrap"><div><span class="eyebrow">Trip</span><h2>${escapeHtml(trip.name)}</h2><p>${escapeHtml(trip.destination)} · ${bs.length} saved item(s)</p></div><span class="badge success">Unified timeline</span></div>${flight&&flight.status==='Confirmed'?`<div class="card" style="margin-top:16px;background:var(--surface-2)"><div class="row wrap"><label style="min-width:170px">Delay<select class="input" data-delay-select="${flight.id}">${delayChoices.map(n=>`<option value="${n}" ${n===60?'selected':''}>${n} minutes</option>`).join('')}</select></label><button class="btn primary" data-delay="${flight.id}">Simulate flight delay</button></div><small class="muted">Only a confirmed flight can trigger downstream repair.</small></div>`:''}<div class="timeline" style="margin-top:24px">${timeline.map(n=>{const b=bs.find(x=>x.id===n.bookingId);const shifted=trip.lastDelay&&(trip.lastDelay.shiftedBookingIds||[]).includes(n.bookingId);const isArrival=n.type==='flight-arrival';const old=trip.lastDelay&&trip.lastDelay.bookingId===n.bookingId&&isArrival?trip.lastDelay.oldArrival:null;const timeHtml=old?`<span class="old-time">${timeLabel(old)}</span> <span class="new-time">${timeLabel(n.at)}</span>`:`<span class="new-time">${timeLabel(n.at)}</span>`;return `<div class="timeline-item ${shifted?'shift-node':''}" data-shifted="${shifted}"><span class="timeline-dot"></span><div class="card" style="padding:16px"><div class="row between wrap"><div><span class="badge">${n.type.replace('flight-','flight ')}</span> <span class="badge ${n.status==='Cancelled'?'danger':'success'}">${n.status}</span></div><div class="time-value">${timeHtml}</div></div><h3 style="margin-top:10px">${escapeHtml(n.title)}</h3><p>${escapeHtml(n.subtitle)} · ${escapeHtml(n.detail)}</p>${b?.status==='Cancelled'?`<span class="badge danger">Cancelled · refund ${formatINR(b.refund)}</span>`:`<button class="btn danger" data-cancel="${b.id}" style="margin-top:8px">Cancel ${escapeHtml(b.type)}</button>`}</div></div>`}).join('')}</div>${bs.filter(b=>b.type==='train').map(b=>`<div class="card" style="margin-top:16px;background:var(--surface-2)"><div class="row between wrap"><div><span class="badge warning">Train · approximate</span><h3 style="margin-top:8px">${escapeHtml(b.item.name)} · ${escapeHtml(b.item.trainNo)}</h3><p>${escapeHtml(b.item.from)} → ${escapeHtml(b.item.to)} · ${escapeHtml(b.item.depart)}–${escapeHtml(b.item.arrive)}</p></div><span class="badge ${b.status==='Cancelled'?'danger':'success'}">${b.status==='Cancelled'?'Cancelled':'Saved'}</span></div><div class="row between" style="margin-top:10px"><strong>${formatINR(b.price.total)}</strong>${b.status==='Cancelled'?`<span class="badge danger">Refund ${formatINR(b.refund)}</span>`:`<button class="btn danger" data-cancel="${b.id}">Cancel train</button>`}</div></div>`).join('')}</article>`}).join(''):emptyState('No trips yet','Compare options and use Save to My Trips to place flights, hotels and cabs on one timeline.');document.querySelectorAll('[data-delay]').forEach(btn=>btn.onclick=()=>{const tripId=btn.closest('[data-trip-id]').dataset.tripId;const minutes=Number(document.querySelector(`[data-delay-select="${btn.dataset.delay}"]`).value);const result=simulateDelay(btn.dataset.delay,minutes);if(!result)return;const trip=Store.read(KEYS.trips).find(t=>t.id===tripId);delayAnimation(result,trip);const moved=result.cabPickupAt?`Cab pickup moved to ${timeLabel(result.cabPickupAt)}, hotel notified.`:`Flight arrival moved to ${timeLabel(result.newArrival)}.`;toast(moved)});document.querySelectorAll('[data-cancel]').forEach(btn=>btn.onclick=()=>{const b=Store.read(KEYS.bookings).find(x=>x.id===btn.dataset.cancel);if(b&&b.status==='Confirmed')refundModal(b)})}
if(s)draw();</script></body></html>
