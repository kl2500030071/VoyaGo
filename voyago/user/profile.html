<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · VoyaGo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="dashboard.html">Voya<span>Go</span></a><nav class="nav-links"><a href="dashboard.html">Home</a><a href="search.html">Search</a><a href="trips.html">My Trips</a><a class="active" href="profile.html">Profile</a><button data-theme-toggle class="btn ghost">🌙</button><button data-logout class="btn ghost">Logout</button></nav></div></header><main class="page"><div class="container" style="max-width:720px"><span class="eyebrow">Profile & preferences</span><h1 style="font-size:42px">Your account</h1><div class="card" style="margin-top:20px"><form id="form"><div class="form-grid"><label>Name<input id="fullName" class="input" required></label><label>Email<input id="email" class="input" disabled></label></div><button class="btn primary" style="margin-top:18px">Save profile</button></form><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h3>Wishlist</h3><div id="wishlist" style="margin-top:14px"></div></div></div></main><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/guard.js"></script><script src="../js/ui.js"></script><script src="../js/pricing.js"></script><script>const s=initPage('user');if(s){const u=Store.read(KEYS.users).find(x=>x.id===s.id);fullName.value=u.name;email.value=u.email;form.onsubmit=e=>{e.preventDefault();Store.patch(KEYS.users,a=>a.map(x=>x.id===s.id?{...x,name:fullName.value.trim()}:x));Store.patch(KEYS.session,x=>({...x,name:fullName.value.trim()}),{});toast('Profile saved');};const ws=Store.read(KEYS.wishlist).filter(x=>x.userId===s.id);wishlist.innerHTML=ws.length?ws.map(w=>`<div class="row between card" style="padding:14px;margin:8px 0"><span>${escapeHtml(w.itemName)}</span><span class="badge">${formatINR(w.price)}</span></div>`).join(''):emptyState('Wishlist is empty','Save an option during search to track it here.')} </script></body></html>
