<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory · VoyaGo</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body><div class="dashboard-grid"><aside class="sidebar"><a class="brand" href="dashboard.html">Voya<span>Go</span></a><p class="muted">Operations</p><a href="dashboard.html">Dashboard</a><a class="active" href="inventory.html">Inventory</a><a href="users.html">Users</a><a href="bookings.html">Redirects & Saved Trips</a><a href="partners.html">Partners</a><a href="reports.html">Reports</a><button data-logout class="btn ghost full">Logout</button></aside><main class="main"><div class="container"><div class="row between wrap"><div><span class="eyebrow">CRUD</span><h1 style="font-size:42px">Inventory</h1><p>Seeded demo data is fully admin-editable.</p></div><button data-theme-toggle class="btn ghost">🌙</button></div><div class="tabs" id="tabs" style="margin-top:22px"><button class="tab active" data-type="flight">Flights</button><button class="tab" data-type="train">Trains</button><button class="tab" data-type="hotel">Hotels</button><button class="tab" data-type="cab">Cabs</button></div><div class="card" style="margin-top:14px"><form id="addForm"><div id="addFields" class="form-grid"></div><button class="btn primary" style="margin-top:16px">Add item</button></form></div><div class="row between wrap" style="margin-top:18px"><input id="searchBox" class="input" style="max-width:420px" placeholder="Search ID, city, route, name, airline…"><span id="pageInfo" class="badge">Page 1</span></div><div id="list" class="card" style="margin-top:12px"></div></div></main></div><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/guard.js"></script><script src="../js/ui.js"></script><script>const s=initPage('admin');let type='flight',page=1;const pageSize=20;function field(id,label,value='',typeAttr='text',extra=''){return `<label>${label}<input class="input" id="${id}" type="${typeAttr}" value="${escapeHtml(value)}" ${extra}></label>`}function renderFields(target='addFields',item={}){const f=target==='addFields'?addFields:document.getElementById(target);if(type==='flight')f.innerHTML=field('invFrom','From','Delhi')+field('invTo','To','Mumbai')+field('invAirline','Airline','IndiGo')+field('invFlightNo','Flight no.','6E 203')+field('invDepart','Depart','06:15','time')+field('invArrive','Arrive','08:25','time')+field('invDuration','Duration','2h 10m')+field('invStops','Stops','0','number','min="0" max="2"')+field('invPrice','Base fare','5200','number','min="1"')+field('invRating','Rating','4.4','number','step="0.1" min="1" max="5"');else if(type==='train')f.innerHTML=field('invFrom','From','Delhi')+field('invTo','To','Mumbai')+field('invTrainName','Train name','Mumbai Rajdhani')+field('invTrainNo','Train no.','12951')+field('invDepart','Depart','17:00','time')+field('invArrive','Arrive','08:35','time')+field('invDuration','Duration','15h 35m')+field('invSL','SL','935','number')+field('inv3A','3A','1765','number')+field('inv2A','2A','2540','number')+field('inv1A','1A','3125','number');else if(type==='hotel')f.innerHTML=field('invCity','City','Mumbai')+field('invName','Hotel name','Taj Mahal Palace')+field('invRating','Rating','4.6','number','step="0.1" min="1" max="5"')+field('invAmenities','Amenities','Wi‑Fi,Breakfast,Pool,AC')+field('invPrice','Nightly base','7200','number','min="1"');else f.innerHTML=field('invCity','City','Mumbai')+field('invBrand','Brand','Uber')+field('invKind','Cab type','Sedan')+field('invEta','ETA minutes','8','number','min="1"')+field('invPrice','Base fare','420','number','min="1"')+field('invRating','Rating','4.5','number','step="0.1" min="1" max="5"');['invFrom','invTo','invCity'].forEach(id=>{const el=document.getElementById(id);if(el&&!el.dataset.combo)createCityCombobox(el)})}function key(){return type==='flight'?'flights':type==='train'?'trains':type==='hotel'?'hotels':'cabs'}function getItems(){return Store.read(KEYS.inventory)[key()]||[]}function save(inv){Store.write(KEYS.inventory,inv)}function makeItemFromForm(root=document){const g=id=>root.querySelector('#'+id);if(type==='flight')return {id:uid('F'),type:'flight',from:g('invFrom').value,to:g('invTo').value,airline:g('invAirline').value,flightNo:g('invFlightNo').value,depart:g('invDepart').value,arrive:g('invArrive').value,duration:g('invDuration').value,stops:Number(g('invStops').value),price:Number(g('invPrice').value),rating:Number(g('invRating').value),seats:10};if(type==='train')return {id:uid('T'),type:'train',from:g('invFrom').value,to:g('invTo').value,name:g('invTrainName').value,trainNo:g('invTrainNo').value,depart:g('invDepart').value,arrive:g('invArrive').value,duration:g('invDuration').value,approximate:true,fares:{SL:Number(g('invSL').value),'3A':Number(g('inv3A').value),'2A':Number(g('inv2A').value),'1A':Number(g('inv1A').value)},price:Number(g('invSL').value),durationMinutes:0};if(type==='hotel')return {id:uid('H'),type:'hotel',city:g('invCity').value,name:g('invName').value,rating:Number(g('invRating').value),amenities:g('invAmenities').value.split(',').map(x=>x.trim()).filter(Boolean),price:Number(g('invPrice').value),rooms:5};return {id:uid('C'),type:'cab',city:g('invCity').value,brand:g('invBrand').value,kind:g('invKind').value,eta:Number(g('invEta').value),price:Number(g('invPrice').value),rating:Number(g('invRating').value)}}function renderList(){const q=searchBox.value.trim().toLowerCase(),all=getItems().filter(x=>JSON.stringify(x).toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(all.length/pageSize));page=Math.min(page,pages);pageInfo.textContent=`Page ${page} of ${pages} · ${all.length} items`;const rows=all.slice((page-1)*pageSize,page*pageSize);list.innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Item</th><th>Route/City</th><th>Base</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${escapeHtml(x.id)}</td><td>${escapeHtml(x.name||x.brand&&x.kind||x.trainNo||x.flightNo||x.kind)}</td><td>${escapeHtml(x.from?`${x.from} → ${x.to}`:x.city)}</td><td>${formatINR(x.type==='train'?x.fares?.SL:x.price)}</td><td class="row"><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Delete</button></td></tr>`).join('')}</tbody></table></div><div class="row between" style="margin-top:14px"><button class="btn ghost" id="prev" ${page===1?'disabled':''}>← Previous</button><button class="btn ghost" id="next" ${page===pages?'disabled':''}>Next →</button></div>`:emptyState('No inventory matches','Try a different search or add a new item.');list.querySelector('#prev')?.addEventListener('click',()=>{page--;renderList()});list.querySelector('#next')?.addEventListener('click',()=>{page++;renderList()});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete(b.dataset.del));list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}function confirmDelete(id){const item=getItems().find(x=>x.id===id);const m=modal('Delete inventory item',`<p>Delete <strong>${escapeHtml(item?.name||item?.flightNo||item?.trainNo||item?.kind||id)}</strong>? This cannot be undone in this browser demo.</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-close>Keep</button><button class="btn danger" id="confirmDelete">Delete</button></div>`);m.querySelector('#confirmDelete').onclick=()=>{const inv=Store.read(KEYS.inventory);inv[key()]=inv[key()].filter(x=>x.id!==id);save(inv);m.remove();toast('Inventory item deleted');renderList()}}function openEdit(id){const item=getItems().find(x=>x.id===id);if(!item)return;const body=`<form id="editForm"><div id="editFields" class="form-grid"></div><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Save changes</button></div></form>`;const m=modal(`Edit ${type}`,body);renderFields('editFields',item);const f=m.querySelector('#editFields');if(type==='flight'){f.querySelector('#invFrom').value=item.from;f.querySelector('#invTo').value=item.to;f.querySelector('#invAirline').value=item.airline;f.querySelector('#invFlightNo').value=item.flightNo;f.querySelector('#invDepart').value=item.depart;f.querySelector('#invArrive').value=item.arrive;f.querySelector('#invDuration').value=item.duration;f.querySelector('#invStops').value=item.stops;f.querySelector('#invPrice').value=item.price;f.querySelector('#invRating').value=item.rating}else if(type==='train'){f.querySelector('#invFrom').value=item.from;f.querySelector('#invTo').value=item.to;f.querySelector('#invTrainName').value=item.name;f.querySelector('#invTrainNo').value=item.trainNo;f.querySelector('#invDepart').value=item.depart;f.querySelector('#invArrive').value=item.arrive;f.querySelector('#invDuration').value=item.duration;f.querySelector('#invSL').value=item.fares.SL;f.querySelector('#inv3A').value=item.fares['3A'];f.querySelector('#inv2A').value=item.fares['2A'];f.querySelector('#inv1A').value=item.fares['1A']}else if(type==='hotel'){f.querySelector('#invCity').value=item.city;f.querySelector('#invName').value=item.name;f.querySelector('#invRating').value=item.rating;f.querySelector('#invAmenities').value=item.amenities.join(',');f.querySelector('#invPrice').value=item.price}else{f.querySelector('#invCity').value=item.city;f.querySelector('#invBrand').value=item.brand;f.querySelector('#invKind').value=item.kind;f.querySelector('#invEta').value=item.eta;f.querySelector('#invPrice').value=item.price;f.querySelector('#invRating').value=item.rating}f.querySelectorAll('.combo input').forEach(el=>el.dispatchEvent(new Event('input')));m.querySelector('#editForm').onsubmit=e=>{e.preventDefault();const next=makeItemFromForm(f);next.id=id;next.type=type;if(type==='flight')next.seats=item.seats;else if(type==='train')next.durationMinutes=item.durationMinutes;else if(type==='hotel')next.rooms=item.rooms;const inv=Store.read(KEYS.inventory);inv[key()]=inv[key()].map(x=>x.id===id?next:x);save(inv);m.remove();toast('Inventory item updated');renderList()}}tabs.onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;page=1;renderFields();renderList()};searchBox.oninput=()=>{page=1;renderList()};addForm.onsubmit=e=>{e.preventDefault();const inv=Store.read(KEYS.inventory),item=makeItemFromForm();if((type==='flight'||type==='train')&&(!document.getElementById('invFrom').value||!document.getElementById('invTo').value)){toast('Choose valid cities from the list.');return}inv[key()].push(item);save(inv);addForm.reset();renderFields();toast('Inventory item added');renderList()};if(s){renderFields();renderList()}</script></body></html>
