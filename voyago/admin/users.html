<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users · VoyaGo</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body><div class="dashboard-grid"><aside class="sidebar"><a class="brand" href="dashboard.html">Voya<span>Go</span></a><p class="muted">Operations</p><a href="dashboard.html">Dashboard</a><a href="inventory.html">Inventory</a><a class="active" href="users.html">Users</a><a href="bookings.html">Redirects & Saved Trips</a><a href="partners.html">Partners</a><a href="reports.html">Reports</a><button data-logout class="btn ghost full">Logout</button></aside><main class="main"><div class="container"><div class="row between wrap"><div><span class="eyebrow">People</span><h1 style="font-size:42px">Users</h1><p>Block, unblock or permanently remove user accounts from this browser demo.</p></div><button data-theme-toggle class="btn ghost">🌙</button></div><div class="card" style="margin-top:22px"><input id="searchBox" class="input" placeholder="Search name or email…"><div id="list" style="margin-top:14px"></div></div></div></main></div><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/guard.js"></script><script src="../js/ui.js"></script><script>const s=initPage('admin');function draw(){const q=searchBox.value.trim().toLowerCase(),a=Store.read(KEYS.users,[]).filter(x=>x.role==='user'&&(!q||`${x.name} ${x.email}`.toLowerCase().includes(q)));list.innerHTML=a.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody>${a.map(u=>`<tr><td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.email)}</td><td><span class="badge ${u.blocked?'danger':'success'}">${u.blocked?'Blocked':'Active'}</span></td><td class="row"><button class="btn" data-block="${u.id}">${u.blocked?'Unblock':'Block'}</button><button class="btn danger" data-delete="${u.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:emptyState('No users','Create a user account from the signup page.');document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{Store.patch(KEYS.users,a=>a.map(u=>u.id===b.dataset.block?{...u,blocked:!u.blocked}:u));toast('User status updated');draw()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const u=Store.read(KEYS.users,[]).find(x=>x.id===b.dataset.delete);const m=modal('Delete user',`<p>Delete <strong>${escapeHtml(u?.email||'this user')}</strong>? Their saved items, trips, alerts, wishlist entries and redirect audit rows will also be removed.</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" id="confirmDelete">Delete permanently</button></div>`);m.querySelector('#confirmDelete').onclick=()=>{const id=b.dataset.delete;Store.patch(KEYS.users,a=>a.filter(x=>x.id!==id));Store.patch(KEYS.bookings,a=>a.filter(x=>x.userId!==id));Store.patch(KEYS.trips,a=>a.filter(x=>x.userId!==id));Store.patch(KEYS.alerts,a=>a.filter(x=>x.userId!==id));Store.patch(KEYS.wishlist,a=>a.filter(x=>x.userId!==id));Store.patch(KEYS.priceAlerts,a=>a.filter(x=>x.userId!==id));Store.patch(KEYS.redirects,a=>a.filter(x=>x.userId!==id));m.remove();toast('User deleted');draw()}})}searchBox.oninput=draw;if(s)draw()</script></body></html>
