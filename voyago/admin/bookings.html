<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirects & Saved Trips · VoyaGo</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body><div class="dashboard-grid"><aside class="sidebar"><a class="brand" href="dashboard.html">Voya<span>Go</span></a><p class="muted">Operations</p><a href="dashboard.html">Dashboard</a><a href="inventory.html">Inventory</a><a href="users.html">Users</a><a class="active" href="bookings.html">Redirects & Saved Trips</a><a href="partners.html">Partners</a><a href="reports.html">Reports</a><button data-logout class="btn ghost full">Logout</button></aside><main class="main"><div class="container"><div class="row between wrap"><div><span class="eyebrow">Audit</span><h1 style="font-size:42px">Redirects & Saved Trips</h1><p>Every partner click-through is logged locally. Saved trips retain the tested itinerary records.</p></div><button data-theme-toggle class="btn ghost">🌙</button></div><div class="card" style="margin-top:22px"><div class="filters"><label>Date<input id="dateFilter" class="input" type="date"></label><label>Platform<select id="platformFilter" class="input"><option value="">All platforms</option></select></label><label>Mode<select id="modeFilter" class="input"><option value="">All modes</option><option>flight</option><option>train</option><option>hotel</option><option>cab</option></select></label><label>User<select id="userFilter" class="input"><option value="">All users</option></select></label><button id="clearFilters" class="btn ghost">Clear</button></div></div><div id="platformCounts" class="grid grid-4" style="margin-top:18px"></div><div id="redirectList" class="card" style="margin-top:18px"></div><div class="row between" style="margin-top:12px"><button class="btn ghost" id="prev">← Previous</button><span id="pageInfo" class="badge">Page 1</span><button class="btn ghost" id="next">Next →</button></div><div class="card" style="margin-top:28px"><div class="row between"><h2>Saved trips</h2><span class="badge success" id="tripTotal">0</span></div><div id="tripList" style="margin-top:14px"></div></div></div></main></div><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/guard.js"></script><script src="../js/ui.js"></script><script>const s=initPage('admin');let page=1;const size=20;function users(){return Store.read(KEYS.users,[])}function rows(){const date=dateFilter.value,platform=platformFilter.value,mode=modeFilter.value,user=userFilter.value;return Store.read(KEYS.redirects,[]).filter(r=>(!date||String(r.time).slice(0,10)===date)&&(!platform||r.platformId===platform)&&(!mode||r.mode===mode)&&(!user||r.userId===user)).sort((a,b)=>new Date(b.time)-new Date(a.time))}function seedFilters(){const rs=Store.read(KEYS.redirects,[]),ps=[...new Map(rs.map(r=>[r.platformId,{id:r.platformId,name:r.platform}])).values()];platformFilter.innerHTML='<option value="">All platforms</option>'+ps.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');userFilter.innerHTML='<option value="">All users</option>'+users().filter(u=>u.role==='user').map(u=>`<option value="${u.id}">${escapeHtml(u.name)} · ${escapeHtml(u.email)}</option>`).join('')}function draw(){const rs=rows(),pages=Math.max(1,Math.ceil(rs.length/size));page=Math.min(page,pages);const slice=rs.slice((page-1)*size,page*size);pageInfo.textContent=`Page ${page} of ${pages} · ${rs.length} redirects`;redirectList.innerHTML=slice.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Platform</th><th>Mode</th><th>Item</th><th>Price</th></tr></thead><tbody>${slice.map(r=>`<tr><td>${new Date(r.time).toLocaleString()}</td><td>${escapeHtml(users().find(u=>u.id===r.userId)?.email||r.userId)}</td><td>${escapeHtml(r.platform)}</td><td>${escapeHtml(r.mode)}</td><td>${escapeHtml(r.item?.name||r.item?.flightNo||r.item?.trainNo||r.item?.kind||r.itemId)}</td><td>${formatINR(r.price)}</td></tr>`).join('')}</tbody></table></div>`:emptyState('No redirects match','Try clearing a filter or run a comparison click-through.');const counts={};Store.read(KEYS.redirects,[]).forEach(r=>counts[r.platform]=(counts[r.platform]||0)+1);platformCounts.innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([p,n])=>`<div class="card"><span class="muted">${escapeHtml(p)}</span><div class="stat">${n}</div></div>`).join('')||emptyState('No redirect data','Click Book on a partner from the user comparison screen.');tripTotal.textContent=Store.read(KEYS.trips,[]).length;const trips=Store.read(KEYS.trips,[]);tripList.innerHTML=trips.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Trip</th><th>User</th><th>Destination</th><th>Saved items</th><th>Created</th></tr></thead><tbody>${trips.slice(0,50).map(t=>`<tr><td>${escapeHtml(t.name)}</td><td>${escapeHtml(users().find(u=>u.id===t.userId)?.email||t.userId)}</td><td>${escapeHtml(t.destination)}</td><td>${t.bookingIds?.length||0}</td><td>${new Date(t.createdAt).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`:emptyState('No saved trips','Save an option to My Trips from the comparison screen.');prev.disabled=page===1;next.disabled=page===pages}dateFilter.onchange=platformFilter.onchange=modeFilter.onchange=userFilter.onchange=()=>{page=1;draw()};clearFilters.onclick=()=>{dateFilter.value='';platformFilter.value='';modeFilter.value='';userFilter.value='';page=1;draw()};prev.onclick=()=>{if(page>1){page--;draw()}};next.onclick=()=>{const pages=Math.max(1,Math.ceil(rows().length/size));if(page<pages){page++;draw()}};if(s){seedFilters();draw()}</script></body></html>
