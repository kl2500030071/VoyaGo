<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partners · VoyaGo</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body><div class="dashboard-grid"><aside class="sidebar"><a class="brand" href="dashboard.html">Voya<span>Go</span></a><p class="muted">Operations</p><a href="dashboard.html">Dashboard</a><a href="inventory.html">Inventory</a><a href="users.html">Users</a><a href="bookings.html">Redirects & Saved Trips</a><a class="active" href="partners.html">Partners</a><a href="reports.html">Reports</a><button data-logout class="btn ghost full">Logout</button></aside><main class="main"><div class="container"><div class="row between wrap"><div><span class="eyebrow">Comparison engine</span><h1 style="font-size:42px">Partner configuration</h1><p>Fee, markup and active settings feed the same compare() engine used by users.</p></div><button data-theme-toggle class="btn ghost">🌙</button></div><div id="modes" class="tabs" style="margin-top:22px"></div><div id="list" class="grid" style="margin-top:18px"></div></div></main></div><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/guard.js"></script><script src="../js/ui.js"></script><script src="../js/partners.js"></script><script>const s=initPage('admin');let mode='flight';function drawTabs(){modes.innerHTML=['flight','train','hotel','cab'].map(x=>`<button class="tab ${x===mode?'active':''}" data-mode="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}function draw(){const all=Store.read(KEYS.partners,{})[mode]||[];list.innerHTML=all.map(p=>`<article class="card"><div class="row between wrap"><div><span class="badge" style="border-left:4px solid ${escapeHtml(p.color)}">${escapeHtml(p.name)}</span><h3 style="margin-top:10px">${escapeHtml(p.id)}</h3><p class="muted">${escapeHtml(p.url)}</p></div><span class="badge ${p.active?'success':'danger'}">${p.active?'Active':'Disabled'}</span></div><div class="form-grid" style="margin-top:14px"><label>Fee model<input class="input" data-fee value="${escapeHtml(p.feeModel||'')}" /></label><label>Minimum markup %<input class="input" data-lo type="number" min="0" max="50" step="0.1" value="${(Number(p.markupRange?.[0]||0)*100).toFixed(1)}"></label><label>Maximum markup %<input class="input" data-hi type="number" min="0" max="50" step="0.1" value="${(Number(p.markupRange?.[1]||0)*100).toFixed(1)}"></label><label class="row" style="align-items:center"><input data-active type="checkbox" ${p.active?'checked':''} style="width:auto"> Active in comparison</label></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" data-save="${escapeHtml(p.id)}">Save partner</button></div></article>`).join('')||emptyState('No partners','No partner configuration exists for this mode.');list.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>{const card=btn.closest('.card'),all=Store.read(KEYS.partners,{}),p=(all[mode]||[]).find(x=>x.id===btn.dataset.save);if(!p)return;const lo=Number(card.querySelector('[data-lo]').value)/100,hi=Number(card.querySelector('[data-hi]').value)/100;if(lo>hi){toast('Minimum markup cannot exceed maximum.');return}p.feeModel=card.querySelector('[data-fee]').value.trim();p.markupRange=[lo,hi];p.active=card.querySelector('[data-active]').checked;Store.write(KEYS.partners,all);toast(`${p.name} updated`);draw()})}modes.onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;drawTabs();draw()};if(s){drawTabs();draw()}</script></body></html>
