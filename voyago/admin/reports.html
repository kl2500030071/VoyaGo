<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports · VoyaGo</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body><div class="dashboard-grid"><aside class="sidebar"><a class="brand" href="dashboard.html">Voya<span>Go</span></a><p class="muted">Operations</p><a href="dashboard.html">Dashboard</a><a href="inventory.html">Inventory</a><a href="users.html">Users</a><a href="bookings.html">Redirects & Saved Trips</a><a href="partners.html">Partners</a><a class="active" href="reports.html">Reports</a><button data-logout class="btn ghost full">Logout</button></aside><main class="main"><div class="container"><div class="row between wrap"><div><span class="eyebrow">Reporting</span><h1 style="font-size:42px">Redirect reports</h1><p>Filter click-through data and export a CSV directly from the browser.</p></div><button data-theme-toggle class="btn ghost">🌙</button></div><div class="card" style="margin-top:22px"><div class="filters"><label>Date<input id="dateFilter" class="input" type="date"></label><label>Platform<select id="platformFilter" class="input"><option value="">All platforms</option></select></label><label>Mode<select id="modeFilter" class="input"><option value="">All modes</option><option>flight</option><option>train</option><option>hotel</option><option>cab</option></select></label><label>User<select id="userFilter" class="input"><option value="">All users</option></select></label><button class="btn primary" id="export">Export redirects CSV</button></div></div><div id="report" class="card" style="margin-top:18px"></div></div></main></div><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/guard.js"></script><script src="../js/ui.js"></script><script>const s=initPage('admin');function seed(){const rs=Store.read(KEYS.redirects,[]);const ps=[...new Map(rs.map(r=>[r.platformId,{id:r.platformId,name:r.platform}])).values()];platformFilter.innerHTML='<option value="">All platforms</option>'+ps.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');userFilter.innerHTML='<option value="">All users</option>'+Store.read(KEYS.users,[]).filter(u=>u.role==='user').map(u=>`<option value="${u.id}">${escapeHtml(u.email)}</option>`).join('')}function rows(){return Store.read(KEYS.redirects,[]).filter(r=>(!dateFilter.value||String(r.time).slice(0,10)===dateFilter.value)&&(!platformFilter.value||r.platformId===platformFilter.value)&&(!modeFilter.value||r.mode===modeFilter.value)&&(!userFilter.value||r.userId===userFilter.value)).sort((a,b)=>new Date(b.time)-new Date(a.time))}function draw(){const a=rows(),by={};a.forEach(r=>by[r.platform]=(by[r.platform]||0)+1);report.innerHTML=`<div class="row between wrap"><div><h3>${a.length} matching redirects</h3><p>${Object.entries(by).map(([k,v])=>`${escapeHtml(k)}: ${v}`).join(' · ')||'No matching platform activity'}</p></div><span class="badge success">${formatINR(a.reduce((n,r)=>n+Number(r.price||0),0))} compared value</span></div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Platform</th><th>Mode</th><th>Item</th><th>Price</th></tr></thead><tbody>${a.slice(0,100).map(r=>`<tr><td>${new Date(r.time).toLocaleString()}</td><td>${escapeHtml(Store.read(KEYS.users,[]).find(u=>u.id===r.userId)?.email||r.userId)}</td><td>${escapeHtml(r.platform)}</td><td>${escapeHtml(r.mode)}</td><td>${escapeHtml(r.item?.name||r.item?.flightNo||r.item?.trainNo||r.item?.kind||r.itemId)}</td><td>${formatINR(r.price)}</td></tr>`).join('')}</tbody></table></div>`}function csvCell(v){return`"${String(v??'').replaceAll('"','""')}"`}export.onclick=()=>{const a=rows(),csv=['id,time,user,platform,mode,item_id,item_name,price',...a.map(r=>[r.id,r.time,r.userId,r.platform,r.mode,r.itemId,r.item?.name||r.item?.flightNo||r.item?.trainNo||r.item?.kind||'',r.price].map(csvCell).join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),aTag=document.createElement('a');aTag.href=url;aTag.download='voyago-redirects.csv';aTag.click();URL.revokeObjectURL(url);toast(`${a.length} redirects exported`)};dateFilter.onchange=platformFilter.onchange=modeFilter.onchange=userFilter.onchange=draw;if(s){seed();draw()}</script></body></html>
