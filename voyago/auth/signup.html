<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · VoyaGo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body class="aurora"><main class="page"><div class="container" style="width:min(540px,calc(100% - 28px))"><a class="brand" href="../index.html">Voya<span>Go</span></a><div class="card" style="margin-top:20px"><span class="eyebrow">Create your trip account</span><h1 style="font-size:36px">Join VoyaGo</h1><form id="form" style="margin-top:22px"><label>Full name<input class="input" id="fullName" required minlength="2"></label><label style="margin-top:14px">Email<input class="input" id="email" type="email" autocomplete="email" required></label><label style="margin-top:14px">Password<div class="row"><input class="input" id="password" type="password" required minlength="8"><button type="button" class="btn ghost" id="toggle">Show</button></div></label><div style="margin-top:8px" class="progress"><span id="strength"></span></div><small id="strengthText" class="muted">Use upper, lower, number and 8+ characters.</small><div id="error" class="badge danger hidden" style="margin-top:14px"></div><button class="btn primary full" id="submit" style="margin-top:18px">Create account</button></form><p style="margin-top:18px">Already registered? <a href="login.html" style="color:var(--primary);font-weight:800">Log in</a></p></div></div></main><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script>password.oninput=()=>{let s=0;s+=password.value.length>=8?25:0;s+=/[A-Z]/.test(password.value)?25:0;s+=/[a-z]/.test(password.value)?25:0;s+=/[0-9]/.test(password.value)?25:0;strength.style.width=s+'%';strengthText.textContent=s<50?'Weak password':s<100?'Almost there':'Strong password'};toggle.onclick=()=>password.type=password.type==='password'?'text':'password';form.onsubmit=async e=>{e.preventDefault();error.classList.add('hidden');submit.disabled=true;try{const u=await signupUser({name:fullName.value,email:email.value,password:password.value});await loginUser(u.email,password.value,'user');location.href='../user/dashboard.html'}catch(err){error.textContent=err.message;error.classList.remove('hidden')}finally{submit.disabled=false}};</script></body></html>
