<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login · VoyaGo</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body class="aurora"><main class="page"><div class="container" style="width:min(500px,calc(100% - 28px))"><a class="brand" href="../index.html">Voya<span>Go</span></a><div class="card" style="margin-top:20px"><span class="eyebrow">Operations console</span><h1 style="font-size:36px">Admin login</h1><p>Seeded demo account for project review.</p><form id="form" style="margin-top:22px"><label>Email<input class="input" id="email" type="email" required></label><label style="margin-top:14px">Password<input class="input" id="password" type="password" required></label><div id="error" class="badge danger hidden" style="margin-top:14px"></div><button class="btn primary full" id="submit" style="margin-top:18px">Enter admin</button></form><p style="margin-top:18px"><a href="login.html">← User login</a></p></div></div></main><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script>form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await loginUser(email.value,password.value,'admin');location.href='../admin/dashboard.html'}catch(err){error.textContent=err.message;error.classList.remove('hidden')}finally{submit.disabled=false}};</script></body></html>
