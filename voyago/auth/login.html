<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · VoyaGo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/effects.css"><link rel="stylesheet" href="../css/pages.css"></head><body class="aurora"><main class="page"><div class="container" style="width:min(500px,calc(100% - 28px))"><a class="brand" href="../index.html">Voya<span>Go</span></a><div class="card" style="margin-top:20px"><span class="eyebrow">Welcome back</span><h1 style="font-size:36px">Log in</h1><p>Continue your trips, alerts and saved plans.</p><form id="form" style="margin-top:24px"><label>Email<input class="input" id="email" type="email" autocomplete="email" required></label><label style="margin-top:14px">Password<div class="row"><input class="input" id="password" type="password" autocomplete="current-password" required><button type="button" class="btn ghost" id="toggle">Show</button></div></label><label class="row" style="margin-top:14px;font-weight:500"><input id="remember" type="checkbox" checked style="width:auto"> Remember me</label><div id="error" class="badge danger hidden" style="margin-top:14px"></div><button class="btn primary full" id="submit" style="margin-top:18px">Log in</button></form><p style="margin-top:18px">New here? <a style="color:var(--primary);font-weight:800" href="signup.html">Create an account</a></p><p><a href="admin-login.html">Admin login →</a></p></div></div></main><script src="../js/storage.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script>const form=document.getElementById('form');toggle.onclick=()=>password.type=password.type==='password'?'text':'password';form.onsubmit=async e=>{e.preventDefault();error.classList.add('hidden');submit.disabled=true;try{const s=await loginUser(email.value,password.value,'user',remember.checked);const q=safeNextPath(new URLSearchParams(location.search).get('next'));location.href=q||'../user/dashboard.html'}catch(err){error.textContent=err.message;error.classList.remove('hidden')}finally{submit.disabled=false}};</script></body></html>
